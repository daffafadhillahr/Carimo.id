<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Carimo.id</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #050505;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .box {
            width: min(100%, 460px);
            padding: 36px;
            background: #101010;
            border: 1px solid #087cff;
            border-radius: 12px;
        }

        .brand-mini {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
        }

        .brand-mini img {
            width: 72px;
            height: 52px;
            object-fit: contain;
            display: block;
        }

        h1 {
            margin-bottom: 10px;
        }

        h1 span {
            color: #087cff;
        }

        p {
            color: #999;
            line-height: 1.6;
            margin-bottom: 26px;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            color: #ddd;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            color: #fff;
            background: #070707;
            border: 1px solid #333;
            border-radius: 7px;
        }

        input:focus {
            outline: none;
            border-color: #087cff;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            color: #fff;
            background: #087cff;
            border: 1px solid #087cff;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .home-button {
            display: block;
            margin-top: 18px;
            padding: 10px 16px;
            color: #fff;
            background: #087cff;
            border: 1px solid #087cff;
            border-radius: 7px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
        }

        .home-button:hover {
            color: #fff;
            background: #0064d6;
            border-color: #0064d6;
        }
    </style>
</head>
<body>
    <main class="box">
        <div class="brand-mini">
            <img src="logo%20carimo.jpeg" alt="Logo Carimo.id">
        </div>
        <h1>Login ke Carimo<span>.id</span></h1>
        <p>Masuk untuk menyimpan data mobil yang Anda inginkan dan melanjutkan ke pembayaran.</p>
        <form id="loginForm">
            <label for="name">
                Nama Lengkap
            </label>
            <input
                id="name"
                type="text"
                placeholder=""
                required>

            <label for="phone">
                Nomor Telepon
            </label>
            <input
                id="phone"
                type="tel"
                inputmode="numeric"
                pattern="[0-9+()\-\s]{10,15}"
                placeholder=""
                required>

            <button type="submit">
                Login dan Cari Mobil
            </button>
        </form>

        <a
            class="home-button"
            href="homepage.html">
            &larr; Kembali ke Beranda
        </a>
    </main>
    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();
            const name = document.getElementById("name").value.trim();
            const phone = document.getElementById("phone").value.trim();

            localStorage.setItem("carimqUser", JSON.stringify({
                name: name,
                phone: phone
            }));

            window.location.href = "cari.html";
        });
    </script>
</body>
</html>
